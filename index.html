<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador: Catálogo de Videojuegos</title>
  <!-- Estilos enlazados desde su carpeta -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Script enlazado en el head con defer desde su carpeta -->
  <script src="js/main.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Catálogo Gamer</h1>
      <p class="subtitulo">Gestión de inventario y títulos disponibles</p>
    </header>

    <!-- Contenedor para feedback visual dinámico -->
    <div id="mensaje-feedback" class="feedback oculto"></div>

    <!-- Sección de formulario para agregar items -->
    <section class="panel-control">
      <h2>Agregar Nuevo Videojuego</h2>
      <form id="formulario-juego" class="formulario">
        <div class="campo">
          <label for="nombre-input">Título:</label>
          <input type="text" id="nombre-input" placeholder="Ej: Silent Hill 2" required>
        </div>

        <div class="campo">
          <label for="precio-input">Precio ($):</label>
          <input type="number" id="precio-input" placeholder="Ej: 35" min="1" required>
        </div>

        <div class="campo">
          <label for="categoria-input">Categoría:</label>
          <input type="text" id="categoria-input" placeholder="Ej: Terror" required>
        </div>

        <button type="submit" id="btn-agregar" class="btn btn-principal">+ Agregar al Catálogo</button>
      </form>
    </section>

    <!-- Sección de búsqueda con evento de teclado -->
    <section class="panel-busqueda">
      <div class="campo">
        <label for="input-busqueda">Filtrar por nombre en tiempo real:</label>
        <input type="text" id="input-busqueda" placeholder="Escribe para buscar...">
      </div>
    </section>

    <!-- Contenedor donde se inyecta la lista dinámica -->
    <main>
      <h2>Títulos en Stock</h2>
      <div id="contenedor-items" class="grid-catalogo"></div>
    </main>
  </div>
</body>
</html>
